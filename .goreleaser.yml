version: 2
before:
  hooks:
    - go mod download
builds:
# The same binary ships under two names: the legacy analyzer plugin (for older CLIs), and the
# language plugin whose RunPlugin re-execs itself as the analyzer.
- &build
  id: analyzer
  env:
  - CGO_ENABLED=0
  goos:
    - darwin
    - windows
    - linux
  goarch:
    - amd64
    - arm64
  binary: pulumi-analyzer-policy-opa
  main: ./cmd/pulumi-analyzer-policy-opa/
  ldflags:
    - -X main.VersionString={{.Version}}
- <<: *build
  id: language
  binary: pulumi-language-opa
archives:
- id: archive
  ids:
  - analyzer
  name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
- id: language-archive
  ids:
  - language
  name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
blobs:
- bucket: get.pulumi.com
  directory: releases/plugins/
  ids:
  - archive
  - language-archive
  provider: s3
  region: us-west-2
snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT"
changelog:
  disable: true
release:
  prerelease: auto
